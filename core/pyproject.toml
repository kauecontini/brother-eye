[project]
name = "brother-eye-core"
version = "0.0.0"
description = "Brother Eye Core skeleton"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23.0",
    "referencing>=0.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brother_eye"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
